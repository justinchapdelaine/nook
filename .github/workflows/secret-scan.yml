# Scans the commits in each pull request, and each push to main, for
# secrets such as API keys and tokens. GitHub push protection is also on;
# this catches the kinds of secret it does not know about.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks needs the history to find the commits being added.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned so a new gitleaks release can't change results unnoticed.
          GITLEAKS_VERSION: 8.30.1
          # Write findings to the job log only, not as PR comments.
          GITLEAKS_ENABLE_COMMENTS: false
