<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Nook settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Nook</h1>
      <p class="lead">Everything Nook does runs on this device.</p>

      <section>
        <h2>Tab tools</h2>
        <p>
          Group tabs by site, close duplicate tabs and undo the last change, from the toolbar icon's right-click menu,
          a tab's right-click menu, or the shortcuts below.
        </p>
        <p id="access" aria-live="polite"></p>
        <button type="button" id="access-button" hidden></button>

        <h3>Shortcuts</h3>
        <dl id="shortcuts"></dl>
        <button type="button" id="change-shortcuts">Change shortcuts</button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
